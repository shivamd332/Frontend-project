<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive E-commerce</title>
    <link rel="stylesheet" href="Signup.css">
</head>
<body>
<!-- this is header top section -->
    <div class="top-header">
        <div class="top-header-content">
            <div class="left-group">
                <p class="sale-text">
                    Summer Sale For All Swim Suits And Free Express Delivery - OFF 50%!
                </p>
                <a href="#" class="shop-now">ShopNow</a>
            </div>
            <div class="lang-box">
                <span class="lang-text">English</span>
                <span class="arrow">&#x25BC;</span> 
            </div>
        </div>
    </div>





    <!-- this is the main header -->
<div class="nav-header">
    <div class="nav-inner">
        <div class="nav-left">
            <div class="logo">Exclusive</div>
            <div class="menu">
                <a href="#" class="menu-item">Home</a>
                <a href="#" class="menu-item">Contact</a>
                <a href="#" class="menu-item">About</a>
                <a href="#" class="menu-item underline-link">Sign Up</a>
            </div>
        </div>
        <div class="search-box">
            <input type="text" placeholder="What are you looking for?" class="search-input">
            <span class="search-icon">&#128269;</span>
        </div>
    </div>
</div>
<div class="header-divider"></div>





<!-- this is signup form section -->
<div class="main-section">
    <div class="left-image-box">
        <img src="Images/Login/Login-image.png" alt="shopping image">
    </div>
    <div class="right-box">
        <div class="heading-block">
            <h2 class="title">Create an account</h2>
            <p class="subtitle">Enter your details below</p>
        </div>
        <div class="form-block">
            <div class="input-group">
                <input type="text" placeholder="Name">
                <div class="underline"></div>
            </div>
            <div class="input-group">
                <input type="text" placeholder="Email or Phone Number">
                <div class="underline"></div>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password">
                <div class="underline"></div>
            </div>
            <button class="create-btn">Create Account</button>
            <button class="google-btn">
                <img src="Images/Google-logo.png" alt="google" class="google-icon">
                Sign up with Google
            </button>
            <div class="login-text">
                <span class="have-account">Already have an account?</span>
                <a href="#" class="login-link">Log in</a>
            </div>
        </div>
    </div>
</div>





<!-- this is footer section -->
    









</body>
</html>
